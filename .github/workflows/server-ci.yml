name: Server CI

on:
  push:
    branches:
      - main
      - develop
    paths: # Only run if server code changes
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches:
      - main
    paths: # Only run if server code changes
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  build-and-test:
    name: Build and Test Server
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        # Assuming 'npm run lint' exists in server/package.json
        # Add "eslint . --ext .js" to package.json scripts if not present
        run: npm run lint --if-present

      - name: Run tests
        # Assuming 'npm test' exists in server/package.json
        run: npm test --if-present
        # env:
        #   CI: true # Often used by test runners
        #   DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }} # Example for test DB
        #   SENTRY_DSN: ${{ secrets.SENTRY_DSN_SERVER }} # Example for Sentry DSN

      # Add step for building if backend has a build step (e.g., TypeScript)
      # - name: Build application
      #   run: npm run build --if-present
